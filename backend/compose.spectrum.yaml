# Native Spectrum session service. It has no public/listening host port.
# Supply private runtime configuration and a signed-in session in this mount.
# Combine with compose.yaml after updating all clients for native DRM.
services:
  velvet-spectrum:
    build:
      context: ../tve/spectrum
    image: velvet-spectrum:local
    restart: unless-stopped
    volumes:
      - ./spectrum-config:/config
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
