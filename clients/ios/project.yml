name: Velvet
options:
  bundleIdPrefix: tv.velvet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
packages:
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
targets:
  Velvet:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - VelvetUITests
        - VelvetTests
    sources:
      - Velvet
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM
    info:
      path: Velvet/Info.plist
      properties:
        CFBundleDisplayName: Velvet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - outfit.ttf
          - inter.ttf
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIRequiresFullScreenIgnoredStartingWithVersion: "26.2"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: tv.velvet.ios
            CFBundleURLSchemes:
              - velvet
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.velvet.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.9.0
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ENABLE_USER_SCRIPT_SANDBOXING: false
  VelvetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/VelvetUITests
    dependencies:
      - target: Velvet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.velvet.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: Velvet
  VelvetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/VelvetTests
    dependencies:
      - target: Velvet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.velvet.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: Velvet
